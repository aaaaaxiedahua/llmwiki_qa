<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f4" />
    <meta name="robots" content="noindex" />
    <title>LLM Wiki — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f4;
        color: #1c1917;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      main { max-width: 24rem; text-align: center; }
      h1 { margin: 0 0 0.75rem; font-size: 1.5rem; }
      p { margin: 0 0 1.5rem; line-height: 1.5; opacity: 0.7; }
      a { color: inherit; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        :root { background: #0c0a09; color: #e7e5e4; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to load your wikis and documents.</p>
      <a href="/wikis">Try again</a>
    </main>
  </body>
</html>
